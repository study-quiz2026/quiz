<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>中学生 一問一答 学習サイト</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>中学生 一問一答</h1><p>学習したい問題集を選んでください</p></header><section id="home" class="panel"><h2>問題集を選ぶ</h2><div class="subject-grid"><button class="subject" data-subject="civics">中学3年<br>公民 <small>50問</small></button><button class="subject" data-subject="history">中学2年<br>歴史 <small>サンプル12問</small></button><button class="subject" disabled>中学3年<br>歴史 <small>準備中</small></button><button class="subject" disabled>中学2年<br>地理 <small>準備中</small></button><button class="subject" disabled>中学1年<br>地理 <small>準備中</small></button><button class="subject" disabled>中学3年<br>英語 <small>準備中</small></button><button class="subject" disabled>中学2年<br>英語 <small>準備中</small></button><button class="subject" disabled>中学1年<br>歴史 <small>準備中</small></button><button class="subject" disabled>追加予定 <small>準備中</small></button></div></section><section id="intro" class="panel hidden"><h2 id="intro-title"></h2><p id="intro-info"></p><div class="actions"><button id="start" class="primary">ランダム10問に挑戦する</button><button id="intro-back">問題集一覧に戻る</button></div></section><section id="quiz" class="panel hidden"><div class="topline"><span id="mode"></span><span id="progress"></span></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary hidden">次の問題へ →</button></section><section id="result" class="panel hidden"><h2>結果発表！</h2><p id="score" class="score"></p><p id="summary"></p><div id="history" class="history"></div><div class="actions"><button id="retry" class="primary hidden">間違えた問題を復習する</button><button id="again">もう一度ランダム10問に挑戦する</button><button id="back">問題集一覧に戻る</button></div></section></main><script src="script.js"></script></body></html>
