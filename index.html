<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中学3年 定期テスト対策</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header><h1>中学3年 定期テスト対策</h1><p>科目を選択してください</p></header>
  <section id="home" class="panel home-panel">
    <div class="subject-grid">
      <button class="subject" disabled><span class="subject-icon">文A</span><span>英語</span></button>
      <button class="subject" data-subject="civics"><span class="subject-icon">▤</span><span>公民</span></button>
      <button class="subject" disabled><span class="subject-icon">♡</span><span>保健体育</span></button>
      <button class="subject" disabled><span class="subject-icon">⚒</span><span>技術・家庭</span></button>
      <button class="subject" disabled><span class="subject-icon">◉</span><span>美術</span></button>
      <button class="subject" disabled><span class="subject-icon">♫</span><span>音楽</span></button>
      <button class="subject" disabled><span class="subject-icon">▦</span><span>数学</span></button>
    </div>
  </section>
  <section id="intro" class="panel hidden"><h2 id="intro-title"></h2><p id="intro-info"></p><div class="actions"><button id="start" class="primary">ランダム10問に挑戦する</button><button id="intro-back">科目選択に戻る</button></div></section>
  <section id="quiz" class="panel hidden"><div class="topline"><span id="mode"></span><span id="progress"></span></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary hidden">次の問題へ →</button></section>
  <section id="result" class="panel hidden"><h2>結果発表！</h2><p id="score" class="score"></p><p id="summary"></p><div id="history" class="history"></div><div class="actions"><button id="retry" class="primary hidden">間違えた問題を復習する</button><button id="again">もう一度ランダム10問に挑戦する</button><button id="back">科目選択に戻る</button></div></section>
</main>
<script src="script.js"></script>
</body>
</html>
